name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu / GCC
            os: ubuntu-24.04
            cmake-args: -DCMAKE_CXX_COMPILER=g++
          - name: Ubuntu / Clang
            os: ubuntu-24.04
            cmake-args: -DCMAKE_CXX_COMPILER=clang++
          - name: Windows / MSVC
            os: windows-2022
            cmake-args: -G "Visual Studio 17 2022" -A x64
          - name: macOS / Apple Clang
            os: macos-15
            cmake-args: -DCMAKE_CXX_COMPILER=clang++

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake-args }}

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error
